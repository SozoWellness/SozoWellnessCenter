kind = "web"
previewPath = "/"
title = "SOZO Wellness Center"
description = "A patient-first wellness clinic website for SOZO Wellness Center in Wildwood near The Villages, Florida, presenting assessments, therapies, the clinic, and a path to request an assessment."
version = "1.0.0"
id = "artifacts/sozo-wellness"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25504

[services.development]
run = "pnpm --filter @workspace/sozo-wellness run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sozo-wellness", "run", "build" ]
serve = "static"
publicDir = "artifacts/sozo-wellness/dist/public"

[[services.production.rewrites]]
from = "/services"
to = "/services/index.html"

[[services.production.rewrites]]
from = "/services/assessments"
