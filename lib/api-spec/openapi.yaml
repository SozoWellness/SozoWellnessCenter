openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: assessments
    description: Assessment request operations
paths:
  /guide-requests:
    get:
      operationId: getGuideAvailability
      summary: Check whether the separate free-book request flow is enabled
      responses:
        "200":
          description: Public availability without secrets or test recipient details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuideAvailability"
    post:
      operationId: submitGuideRequest
      summary: Request the free Perfect Day Lifestyle PDF and an emailed link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuideRequestInput"
      responses:
        "201":
          description: Book request accepted by the delivery workflow, not proof of email delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuideRequestReceipt"
        "400":
          description: Invalid request, not forwarded
        "403":
          description: Security check or restricted-recipient check rejected
        "413":
          description: Request too large
        "415":
          description: JSON required
        "429":
          description: Too many attempts
        "502":
          description: Delivery is unconfirmed; do not automatically retry
        "503":
          description: Book request setup is unavailable; not forwarded
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /assessment-requests:
    post:
      operationId: submitAssessmentRequest
      tags: [assessments]
      summary: Submit a request for an initial assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentRequestInput"
      responses:
        "201":
          description: Request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentRequestReceipt"
        "400":
          description: Invalid request
        "429":
          description: Too many requests
components:
  schemas:
    GuideAvailability:
      type: object
      required: [enabled, mode]
      properties:
        enabled: { type: boolean }
        mode: { type: string, enum: [disabled, test, live] }
    GuideRequestInput:
      type: object
      additionalProperties: false
      required: [firstName, email, marketingConsent, requestId, turnstileToken]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        marketingConsent:
          type: boolean
          description: Optional promotional email permission, independent of the requested book email.
        requestId: { type: string, format: uuid }
        turnstileToken: { type: string, minLength: 1, maxLength: 2048 }
        website: { type: string, maxLength: 0, description: Honeypot, must remain empty }
    GuideRequestReceipt:
      type: object
      required: [success, message, downloadUrl, requestId]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        downloadUrl: { type: string, format: uri }
        requestId: { type: string, format: uuid }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AssessmentRequestInput:
      type: object
      additionalProperties: false
      required: [name, email, phone, interest, consent, smsConsent, marketingConsent]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
          maxLength: 16
          description: Required mobile number in international E.164 format.
        interest: { type: string, minLength: 1, maxLength: 120 }
        message: { type: string, maxLength: 1500 }
        consent: { type: boolean, enum: [true] }
        smsConsent:
          type: boolean
          description: Optional permission for automated texts about this assessment request. False must not prevent saving the enquiry.
        marketingConsent:
          type: boolean
          description: Optional permission for email marketing. False must never subscribe or resubscribe the visitor.
        website: { type: string, maxLength: 0, description: Honeypot field, must remain empty }
        turnstileToken:
          type: string
          minLength: 1
          maxLength: 2048
          description: Single-use verification token. Required by Cloudflare Pages before forwarding; never stored or sent to Zapier. Optional only for the save-only development API.
    AssessmentRequestReceipt:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }

